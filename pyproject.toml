[project]
name = "channel"
version = "0.1.0"
description = "Automated Hindi buying-guide video pipeline built from structured product data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.80",
    "google-cloud-texttospeech>=2.16",
    "matplotlib>=3.8",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
channel = "channel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Devanagari / rupee symbols are intentional

[tool.ruff.lint.per-file-ignores]
# Narration phrasebook and prompt text: long prose lines are easier to edit unsplit.
"src/channel/scripts/templates.py" = ["E501"]
"src/channel/scripts/prompts.py" = ["E501"]
"src/channel/render/captions.py" = ["E501"]  # ASS header format lines
