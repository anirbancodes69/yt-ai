# Video formats. target_words feeds the script-length warning (assumes
# words_per_minute); target_seconds is enforced at render time by gently
# re-timing the narration (atempo, 0.9x-1.2x) and failing beyond that.

price_bands_inr: [10000, 15000, 20000, 30000, 50000]

words_per_minute: {hi: 140, en: 150}

formats:
  best_under:
    title: Best phone under X
    orientation: landscape
    target_words: [840, 1260]
    target_seconds: [360, 540]
    min_products: 3
    max_products: 6
  head_to_head:
    title: Head-to-head comparison
    orientation: landscape
    target_words: [840, 1260]
    target_seconds: [360, 540]
  launch_explainer:
    title: Launch-day explainer
    orientation: landscape
    target_words: [840, 1260]
    target_seconds: [360, 540]
    rivals: 2                 # top-ranked phones in the same band to compare against
  deal_short:
    title: Deal / price-drop Short
    orientation: portrait
    target_words: [70, 117]
    target_seconds: [30, 50]
  monthly_refresh:
    title: Monthly refresh of best-under-X lists
    orientation: landscape
    target_words: [840, 1260]
    target_seconds: [360, 540]
    min_products: 3
    max_products: 6
    lookback_days: 30
