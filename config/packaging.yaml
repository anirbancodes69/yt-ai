# Packaging: title, description, tags, chapters, thumbnail text, affiliate links.
# Everything here is wording and rules. Numbers are never written here: {placeholders}
# are filled from the fact table, and every number in the result is re-verified.

category_id: 28                 # YouTube "Science & Technology"
made_for_kids: false
# Realistic synthetic voice: disclose as altered/synthetic content (conservative default).
contains_synthetic_media: true

limits:
  title_chars: 100              # YouTube hard limit
  title_soft_chars: 70          # longer titles get cut off in search results (warning)
  description_bytes: 5000       # YouTube limit is in UTF-8 BYTES (Devanagari = 3 bytes/char)
  tags_chars: 500
  tag_chars: 30
  hashtags_max: 15              # YouTube ignores all hashtags if there are more than 15
  chapter_min_seconds: 10
  chapter_min_count: 3
  thumbnail_bytes: 2000000      # YouTube limit is 2 MB

# ---------------------------------------------------------------- affiliate links
# Affiliate IDs come from the environment (.env), never from this file or the data.
# A listing's retailer must be a key here. `sample_value` is used ONLY for SAMPLE data.
affiliate:
  retailers:
    amazon:
      label: Amazon
      param: tag
      env: AMAZON_ASSOCIATES_TAG
    flipkart:
      label: Flipkart
      param: affid
      env: FLIPKART_AFFILIATE_ID
    sample-store-a:
      label: Sample Store A
      param: ref
      env: SAMPLE_AFFILIATE_TAG
      sample_value: sample-tag
    sample-store-b:
      label: Sample Store B
      param: ref
      env: SAMPLE_AFFILIATE_TAG
      sample_value: sample-tag

